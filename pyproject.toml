[project]
name = "policy-scraper"
version = "0.1.0"
description = "CITS5501 Group 11: scraper for the UWA policy library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]

# A single script (scraper.py), not an installable package.
[tool.uv]
package = false

# Default rule set for now (Phase 1, Q12); target version comes from requires-python.
[tool.ruff]

[tool.mypy]
python_version = "3.10"
files = ["scraper.py"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.17.0",
    "types-requests>=2.33.0.20261006",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]